name: Deploy to EC2 (k3d resilient app)

on:
  workflow_dispatch:

jobs:
  copy-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run deploy on EC2 (clone repo and execute)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            rm -rf ~/resilient-app-deploy || true
            echo "Cloning repository on EC2..."
            if git clone --depth=1 https://github.com/emadtasha/k3s-multinode-kompose-task.git ~/resilient-app-deploy; then
              echo "Cloned public repo"
            else
              echo "Public clone failed; attempting to use existing copy or scp fallback"
            fi
            cd ~/resilient-app-deploy || { echo "Directory missing" >&2; ls -la ~; exit 1; }
            echo "Deploy directory contents:"; ls -la
            if [ -f ./scripts/deploy.sh ]; then
              chmod +x ./scripts/deploy.sh
              ./scripts/deploy.sh
            elif [ -f ./deploy.sh ]; then
              chmod +x ./deploy.sh
              ./deploy.sh
            else
              echo "No deploy script found in ~/resilient-app-deploy" >&2
              ls -R .
              exit 1
            fi
